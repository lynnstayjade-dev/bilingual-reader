<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>锋刊 · 双语外刊精读台</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1a2e">
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#1a1a2e; --muted:#6b6b7b; --line:#e6e2d8;
  --accent:#b3402f; --accent2:#1f6f5c; --soft:#f0ede4; --card:#fff; --shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
[data-theme="dark"]{--bg:#15151c;--panel:#1f1f29;--ink:#ece9e2;--muted:#9a96a8;--line:#2c2c38;--accent:#e0654f;--accent2:#4fb89a;--soft:#23232e;--card:#23232e;--shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);}
[data-theme="sepia"]{--bg:#efe7d3;--panel:#f6efdd;--ink:#3a2f1d;--muted:#7c6f57;--line:#ddcfb0;--accent:#a8541f;--accent2:#5e7d4f;--soft:#e7dcc0;--card:#f6efdd;--shadow:0 1px 3px rgba(80,60,20,.12),0 8px 24px rgba(80,60,20,.08);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}
/* ---- masthead ---- */
.mast{max-width:1120px;margin:0 auto;padding:18px 20px 10px;border-bottom:2px solid var(--ink)}
.mast .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--serif);font-weight:700;font-size:30px;letter-spacing:.5px}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);display:block;letter-spacing:2px;margin-top:-2px}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.nav button{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:14px;padding:7px 13px;border-radius:20px;cursor:pointer;font-weight:600}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav .grow{margin-left:auto;display:flex;gap:6px;align-items:center}
.install{background:var(--accent);color:#fff;border:none;padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
/* ---- home ---- */
.wrap{max-width:1120px;margin:0 auto;padding:16px 20px 80px}
.rail{display:flex;gap:8px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.src{flex:0 0 auto;padding:6px 12px;border-radius:18px;background:var(--soft);font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.src.on{background:var(--ink);color:var(--bg)}
.src .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent2);margin-right:5px;vertical-align:middle}
.cats{display:flex;gap:6px;flex-wrap:wrap;padding:12px 0}
.cats button{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:5px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.cats button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.search{width:100%;max-width:340px;padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);font-size:14px;margin:6px 0 14px}
/* daily sentence */
.daily{background:linear-gradient(135deg,var(--accent),#7a2a1e);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.daily .lab{font-size:12px;letter-spacing:2px;opacity:.85;text-transform:uppercase}
.daily .en{font-family:var(--serif);font-size:20px;line-height:1.5;margin:8px 0;font-style:italic}
.daily .cn{font-size:14px;opacity:.92}
.daily .acts{margin-top:12px;display:flex;gap:8px}
.daily .acts button{border:none;background:rgba(255,255,255,.18);color:#fff;padding:6px 14px;border-radius:16px;font-size:13px;cursor:pointer;font-weight:600}
.daily .acts button.done{background:#fff;color:var(--accent)}
.daily .stamp{position:absolute;right:16px;top:14px;font-size:12px;opacity:.7}
/* hero + grid */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;margin-bottom:26px}
.lead .kicker{font-size:12px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;font-weight:700}
.lead h2{font-family:var(--serif);font-size:30px;line-height:1.25;margin:8px 0 10px}
.lead .dek{font-size:15px;color:var(--muted);margin-bottom:10px}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.readbtn{margin-top:14px;background:var(--ink);color:var(--bg);border:none;padding:10px 20px;border-radius:22px;font-weight:700;cursor:pointer;font-size:14px}
.side .mini{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.side .mini .k{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px}
.side .mini .t{font-family:var(--serif);font-size:16px;margin-top:3px;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card .kicker{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
.card .kicker .lv{background:var(--soft);padding:1px 8px;border-radius:10px;color:var(--accent)}
.card h3{font-family:var(--serif);font-size:19px;line-height:1.3;margin:8px 0}
.card .dek{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:15px}
/* ---- reader ---- */
.reader{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;display:none}
.reader.open{display:block}
.rtop{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;z-index:5}
.rtop .back{background:none;border:1px solid var(--line);border-radius:18px;padding:6px 14px;cursor:pointer;color:var(--ink);font-weight:600;font-size:13px}
.rtop .seg{display:flex;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rtop .seg button{background:none;border:none;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.rtop .seg button.on{background:var(--soft);color:var(--ink);font-weight:700}
.rtop .ico{margin-left:auto;display:flex;gap:6px}
.rtop .ico button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:15px;color:var(--ink)}
#progress{height:3px;background:var(--accent);width:0;transition:width .1s}
.article{max-width:760px;margin:0 auto;padding:22px 20px 120px;font-size:18px}
.article .kicker{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:700;text-transform:uppercase}
.article h1{font-family:var(--serif);font-size:32px;line-height:1.25;margin:8px 0 12px}
.byline{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.article .meta{margin-bottom:14px}
.dek{font-size:17px;color:var(--muted);font-style:italic;margin-bottom:18px;padding-left:14px;border-left:3px solid var(--accent)}
.para{font-family:var(--serif);margin:0 0 16px;line-height:1.75}
.para.en{color:var(--ink)}
.para.cn{color:var(--muted);font-size:.92em;font-family:var(--sans);border-left:2px solid var(--line);padding-left:12px;margin-top:-8px}
.w{ cursor:pointer;border-bottom:1px dotted transparent;transition:background .1s }
.w:hover{background:var(--soft);border-bottom-color:var(--accent)}
.collocation{text-decoration:underline dotted var(--accent2);text-underline-offset:3px;cursor:pointer}
.pull{font-family:var(--serif);font-size:21px;font-style:italic;color:var(--accent);border-left:4px solid var(--accent);padding:6px 0 6px 18px;margin:22px 0;line-height:1.5}
.ptool{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
.ptool button{border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:11px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.para.hidecn{display:none}
/* side panel */
.panel{position:fixed;top:0;right:0;height:100%;width:min(380px,92vw);background:var(--panel);box-shadow:-8px 0 30px rgba(0,0,0,.15);z-index:60;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel .ph{display:flex;border-bottom:1px solid var(--line)}
.panel .ph button{flex:1;background:none;border:none;padding:13px 4px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:600;border-bottom:2px solid transparent}
.panel .ph button.on{color:var(--accent);border-bottom-color:var(--accent)}
.panel .pclose{position:absolute;right:10px;top:10px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted);z-index:2}
.panel .pbody{flex:1;overflow-y:auto;padding:16px}
.tag{display:inline-block;background:var(--soft);color:var(--ink);padding:5px 11px;border-radius:14px;margin:4px 4px 0 0;font-size:13px;cursor:pointer}
.tag:hover{background:var(--accent);color:#fff}
.qitem{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:10px;font-family:var(--serif);font-size:15px;font-style:italic}
.qitem small{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:4px}
/* grammar tree */
.gnode{border-left:2px solid var(--line);padding:6px 0 6px 14px;margin:6px 0 6px 6px;font-size:14px}
.gnode .tagf{display:inline-block;background:var(--accent2);color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;margin-right:6px;font-weight:600}
.gnode.main .tagf{background:var(--accent)}
.gsum{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--ink);margin-bottom:10px}
/* ---- word popup ---- */
.pop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;max-width:320px;display:none}
.pop .pw{font-family:var(--serif);font-size:22px;font-weight:700}
.pop .pp{color:var(--accent);font-size:14px;margin:2px 0}
.pop .ppos{color:var(--muted);font-size:12px;margin-left:8px}
.pop .pcn{font-size:15px;margin:6px 0}
.pop .pen{font-size:13px;color:var(--muted);font-style:italic}
.pop .pacts{display:flex;gap:6px;margin-top:10px}
.pop .pacts button{border:none;border-radius:14px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600}
.pop .pacts .s{background:var(--accent);color:#fff}
.pop .pacts .a{background:var(--soft);color:var(--ink)}
/* ---- learning center / vocab ---- */
.view{max-width:860px;margin:0 auto;padding:20px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--serif);font-size:28px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;gap:5px;height:90px;align-items:flex-end;margin:14px 0}
.bars .b{flex:1;background:var(--accent2);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars .b i{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.startbtn{background:var(--accent);color:#fff;border:none;padding:12px 26px;border-radius:24px;font-weight:700;font-size:15px;cursor:pointer}
/* session */
.session{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow);text-align:center}
.session .q{font-family:var(--serif);font-size:34px;margin:10px 0}
.session .pa{color:var(--accent);font-size:18px;margin:8px 0}
.session .pc{font-size:16px;color:var(--muted);margin:4px 0 18px}
.session .rate{display:flex;gap:10px;justify-content:center}
.session .rate button{flex:1;max-width:160px;border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;color:#fff}
.rate .know{background:var(--accent2)}.rate .vague{background:#c79a2e}.rate .unk{background:var(--accent)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow)}
.vcard .vw{font-family:var(--serif);font-size:19px;font-weight:700;cursor:pointer}
.vcard .vp{color:var(--accent);font-size:13px}
.vcard .vc{font-size:13.5px;color:var(--muted);margin-top:3px}
.vcard .vx{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
.vcard .vb{font-size:11px;color:var(--accent2);margin-top:5px}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 13px;margin:10px 0;line-height:1.5}
.setrow{margin:14px 0}
.setrow label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.setrow small{color:var(--muted);font-weight:400}
.setrow input[type=text]{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:14px}
.seg2{display:flex;gap:6px;flex-wrap:wrap}
.seg2 button{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:16px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg2 button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
/* ---- 小说 ---- */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:6px}
.bcard{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.bcover{width:72px;height:104px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex:0 0 auto}
.bcover img{width:100%;height:100%;object-fit:cover}
.binfo{flex:1;min-width:0}
.btitle{font-family:var(--serif);font-size:19px;font-weight:700}
.bcn{font-size:13px;color:var(--muted);margin:4px 0}
.bmeta{font-size:12px;color:var(--muted);margin-bottom:8px}
.bchapters{display:flex;gap:6px;flex-wrap:wrap}
.chbtn{border:1px solid var(--line);background:var(--panel);padding:5px 11px;border-radius:14px;cursor:pointer;font-size:12px;color:var(--ink)}
.chbtn:hover{border-color:var(--accent);color:var(--accent)}
.chap{font-family:var(--serif);font-size:15px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
.booknav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.booknav button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:16px;cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.booknav button:disabled{opacity:.4;cursor:not-allowed}
.bnpos{font-size:12px;color:var(--muted)}
.tts{border:1px solid var(--accent);background:transparent;color:var(--accent);padding:4px 10px;border-radius:14px;cursor:pointer;font-size:12px;font-weight:600;margin-left:6px}
.tts:hover{background:var(--accent);color:#fff}
.uploadbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 4px;padding:12px 14px;background:var(--soft);border-radius:14px}
.upbtn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 16px;border-radius:18px;cursor:pointer;font-size:14px;font-weight:600}
.upbtn:hover{opacity:.9}
.uplab{font-size:12px;color:var(--muted)}
.bh{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:700}
.chbtn.del{border-color:transparent;color:var(--muted)}
.chbtn.del:hover{color:#c0392b;border-color:#c0392b}
.epub-help{margin:8px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow)}
.epub-help summary{cursor:pointer;padding:12px 0;font-size:14px;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
.epub-help summary::-webkit-details-marker{display:none}
.epub-help[open] summary{padding-bottom:6px}
.epub-help ol{margin:6px 0 10px 20px;line-height:1.7;font-size:13px;color:var(--ink)}
.epub-help ol b{color:var(--accent)}
.epub-help p{margin:4px 0 12px;font-size:12px;color:var(--muted)}
.transbar{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 14px;background:var(--soft);border-radius:12px}
.transbar button{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 14px;border-radius:16px;cursor:pointer;font-size:13px;font-weight:600}
.transbar button:disabled{opacity:.6;cursor:not-allowed}
.transprog{font-size:12px;color:var(--muted)}
.note-actions{margin:10px 0}
.notes-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.note-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.note-text{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--ink)}
.note-cn{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13.5px;line-height:1.7;color:var(--muted);margin-top:6px;padding-left:2px}
.note-meta{font-size:12px;color:var(--muted);margin:6px 0 4px}
.note-note{font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:8px 10px;margin:6px 0}
.note-empty{color:var(--muted);font-style:italic}
.note-btns{display:flex;gap:8px;margin-top:8px}
.nb{border:1px solid var(--line);background:var(--panel);padding:5px 12px;border-radius:14px;cursor:pointer;font-size:12px;color:var(--ink)}
.nb:hover{border-color:var(--accent);color:var(--accent)}
.nb.del:hover{color:#c0392b;border-color:#c0392b}
.linklike{border:none;background:transparent;color:var(--accent);font-weight:600;cursor:pointer;padding:0 2px;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(2px)}
.modal-card{background:var(--card);border-radius:16px;padding:16px;max-width:92vw;max-height:90vh;overflow:auto;box-shadow:0 12px 48px rgba(0,0,0,.35)}
.mc-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
.mc-close{border:none;background:transparent;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal-card img{width:100%;max-width:440px;display:block;margin:0 auto;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.mc-acts{display:flex;gap:10px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.mc-acts button,.mc-acts a{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 18px;border-radius:18px;cursor:pointer;font-size:13px;text-decoration:none;font-weight:600}
.mc-acts a.ghost,.mc-acts button.ghost{background:transparent;color:var(--accent)}
.mc-hint{margin-top:10px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.lead h2{font-size:24px}.article{font-size:17px}.brand{font-size:24px}}
/* ---- 学习中心 / 流利说式闭环 ---- */
.ll-head{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent),#7a2a1e);color:#fff;border-radius:16px;padding:16px 20px;margin:14px 0;box-shadow:var(--shadow)}
.ll-head .lv{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);flex:0 0 auto}
.ll-head .lv b{font-size:22px;line-height:1}.ll-head .lv span{font-size:10px;opacity:.85}
.ll-head .xp{flex:1;min-width:0}
.ll-head .xp .lab{font-size:12px;opacity:.95}
.ll-head .xp .bar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin-top:6px}
.ll-head .xp .bar i{display:block;height:100%;background:#fff;transition:width .3s}
.ll-head .streak{text-align:center;flex:0 0 auto}.ll-head .streak b{font-size:24px;font-family:var(--serif);display:block;line-height:1}.ll-head .streak span{font-size:11px;opacity:.85}
.ll-quest{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.qtask{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}

.ll-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:6px 0 14px}

.ll-tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* shadow / dictation studio */
.studio{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.st-hint{font-size:12px;letter-spacing:1px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:10px}

.st-play{margin:10px 0}.st-play audio{width:100%}

.st-result .st-you{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:10px}
.st-rate{display:flex;gap:8px}.st-rate button{flex:1;border:none;border-radius:14px;padding:10px;font-weight:700;color:#fff;cursor:pointer}
.st-rate .know{background:var(--accent2)}.st-rate .vague{background:#c79a2e}.st-rate .unk{background:var(--accent)}
.dt-sent{font-family:var(--serif);font-size:21px;line-height:1.7;margin:10px 0}

.dt-in.ok{border-bottom-color:var(--accent2)}.dt-in.bad{border-bottom-color:var(--accent);color:var(--accent)}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}
.badge{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow);opacity:.55}
.badge.on{opacity:1;border-color:var(--accent2)}
.badge b{font-size:24px}.badge .bn{font-weight:700;font-size:14px}.badge small{color:var(--muted);font-size:12px}

<body>

  <div class="top">
    <div class="brand">锋刊<small>BILINGUAL FOREIGN-PRESS READER</small></div>

  <nav class="nav">

<!-- HOME -->

<div class="view hidden" id="vocabView"></div>

<div class="view hidden" id="settingsView"></div>

<script src="fflate.min.js"></script>
<script>
/* ============ 数据层 ============ */
let ARTICLES=[], BOOKS=[], DICT={}, CUR=null, MODE='both';
let curSrc='ALL', curCat='all', curQ='';
const LS={ data:'br_dataurl', booksurl:'br_booksurl', vocab:'br_vocab', streak:'br_streak', read:'br_read', theme:'br_theme', font:'br_font', daily:'br_daily', goal:'br_goal', ll:'br_ll', sent:'br_sent', notes:'br_notes' };
function getLS(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function setLS(k,v){try{localStorage.setItem(k,v);}catch(e){}}

async function loadData(){
  const url=getLS(LS.data)||'articles.json';
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw 0;
    ARTICLES=await r.json();
  }catch(e){ try{ARTICLES=await (await fetch('articles.json')).json();}catch(_){ARTICLES=[];} }
}
async function loadDict(){
  // 加载顺序：124 词中文精校 → 全词 IPA/英文（由 articles.json 真实词预抓）→ 完整 ECDICT（若已生成）
  try{ const r=await fetch('dict.min.json',{cache:'no-store'}); if(r.ok) DICT=await r.json(); }catch(e){}
  try{ const r=await fetch('dict.api.json',{cache:'no-store'}); if(r.ok) DICT=Object.assign({},DICT,await r.json()); }catch(e){}
  try{ const r=await fetch('dict.json',{cache:'no-store'}); if(r.ok) DICT=Object.assign({},DICT,await r.json()); }catch(e){}
}
async function loadBooksData(){
  const url=getLS(LS.booksurl)||'books.json';
  try{ const r=await fetch(url,{cache:'no-store'}); if(r.ok) BOOKS=await r.json(); }catch(e){ try{BOOKS=await (await fetch('books.json')).json();}catch(_){BOOKS=[];} }
}

/* ============ 日期 ============ */
function fmtDate(){const d=new Date();return d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});}
function dayKey(d){return d.toISOString().slice(0,10);}
function dayOfYear(){const n=new Date();const s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000);}

/* ============ 每日金句 ============ */
const DAILY_SENTENCES=[
  {en:"The only way to do great work is to love what you do.",cn:"成就伟大工作的唯一途径，是热爱你所做的事。",src:"Steve Jobs"},
  {en:"We are what we repeatedly do; excellence, then, is not an act but a habit.",cn:"我们重复做的事造就了我们；卓越因此不是一时的举动，而是一种习惯。",src:"Aristotle"},
  {en:"It does not matter how slowly you go as long as you do not stop.",cn:"只要你不停下脚步，走得慢一点也无妨。",src:"Confucius"},
  {en:"That which does not kill us makes us stronger.",cn:"凡杀不死我们的，必使我们更强大。",src:"Nietzsche"},
  {en:"In the middle of difficulty lies opportunity.",cn:"困难之中，往往蕴藏着机遇。",src:"Albert Einstein"},
  {en:"The future belongs to those who believe in the beauty of their dreams.",cn:"未来属于那些相信梦想之美的人。",src:"Eleanor Roosevelt"},
  {en:"Success is not final, failure is not fatal: it is the courage to continue that counts.",cn:"成功非终点，失败非末日；真正重要的是继续前行的勇气。",src:"Winston Churchill"},
  {en:"Reading is to the mind what exercise is to the body.",cn:"阅读之于心智，犹如运动之于身体。",src:"Joseph Addison"},
  {en:"A reader lives a thousand lives before he dies.",cn:"一个读者在逝去之前，已活过千种人生。",src:"George R.R. Martin"},
  {en:"The man who moves a mountain begins by carrying away small stones.",cn:"移山之人，始于搬走小块石头。",src:"Confucius"},
  {en:"Well done is better than well said.",cn:"做得漂亮，胜过说得漂亮。",src:"Benjamin Franklin"},
  {en:"Knowledge is power.",cn:"知识就是力量。",src:"Francis Bacon"},
  {en:"The beautiful thing about learning is that no one can take it away from you.",cn:"学习的美妙之处在于，无人能从你身上夺走它。",src:"B.B. King"},
  {en:"Smooth seas do not make skillful sailors.",cn:"风平浪静的海面，造就不出熟练的水手。",src:"African proverb"},
  {en:"Wisdom is not a product of schooling but of the lifelong attempt to acquire it.",cn:"智慧并非学业的产物，而是一生求索的结晶。",src:"Albert Einstein"},
  {en:"Language is the road map of a culture.",cn:"语言，是一张文化的地图。",src:"Rita Mae Brown"},
  {en:"To have another language is to possess a second soul.",cn:"掌握另一种语言，便是拥有第二个灵魂。",src:"Charlemagne"},
  {en:"The limits of my language mean the limits of my world.",cn:"我的语言的界限，即我的世界的界限。",src:"Ludwig Wittgenstein"},
  {en:"Practice isn't the thing you do once you're good. It's the thing you do that makes you good.",cn:"练习不是变好之后才做的事，而是让你变好的事本身。",src:"Malcolm Gladwell"},
  {en:"Curiosity is the engine of achievement.",cn:"好奇心，是成就的引擎。",src:"Ken Robinson"}
];
function todaySentence(){return DAILY_SENTENCES[dayOfYear()%DAILY_SENTENCES.length];}
function markDailyLearned(){const k=dayKey(new Date());const d=JSON.parse(getLS(LS.daily)||'{}');d[k]=true;setLS(LS.daily,JSON.stringify(d));}

/* ============ 工具 ============ */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function catName(c){const m={news:'新闻',business:'商业',science:'科学',health:'健康',world:'世界',culture:'文化',opinion:'观点'};return m[c]||c;}

/* ============ 渲染：来源/分类 ============ */
const SOURCES=[{n:'NPR',live:true},{n:'The Atlantic'},{n:'The New Yorker'},{n:'The Economist'},{n:'Financial Times'},{n:'The New York Times'},{n:'The Guardian'},{n:'Scientific American'},{n:'Harvard Business Review'},{n:'BBC'},{n:'Vox'},{n:'The Conversation'}];
function renderRail(){
  const el=document.getElementById('rail');
  el.innerHTML=`<div class="src ${curSrc==='ALL'?'on':''}" data-s="ALL">全部来源</div>`+
    SOURCES.map(s=>`<div class="src ${curSrc===s.n?'on':''}" data-s="${s.n}">${s.live?'<span class="dot"></span>':''}${s.n}</div>`).join('');
  el.querySelectorAll('.src').forEach(b=>b.onclick=()=>{curSrc=b.dataset.s;renderRail();renderHome();});
}
const CATS=[['all','全部'],['news','新闻'],['business','商业'],['science','科学'],['health','健康'],['world','世界'],['culture','文化'],['opinion','观点']];
function renderCats(){
  const el=document.getElementById('cats');
  el.innerHTML=CATS.map(c=>`<button class="${curCat===c[0]?'on':''}" data-c="${c[0]}">${c[1]}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{curCat=b.dataset.c;renderCats();renderHome();});
}

/* ============ 每日金句卡 ============ */
function renderDaily(){
  const s=todaySentence();const k=dayKey(new Date());const done=JSON.parse(getLS(LS.daily)||'{}')[k];
  document.getElementById('dailyCard').innerHTML=`
    <div class="stamp">每日金句 · DAY ${dayOfYear()}</div>
    <div class="lab">Quote of the Day</div>
    <div class="en">"${esc(s.en)}"</div>
    <div class="cn">${esc(s.cn)}</div>
    <div class="acts">
      <button class="${done?'done':''}" id="dailyLearn">${done?'✓ 今日已学':'学这句 →'}</button>
      <button id="dailySave">收藏金句</button>
    </div>`;
  document.getElementById('dailyLearn').onclick=()=>{
    markDailyLearned();
    // 抽词入本
    (s.en.match(/[A-Za-z][A-Za-z'-]+/g)||[]).forEach(w=>{const lw=w.toLowerCase();if(lw.length>3) addVocab(lw);});
    renderDaily();
  };
  document.getElementById('dailySave').onclick=()=>{addQuoteCollect(s.en,s.cn);};
}

/* ============ 首页 ============ */
function filtered(){
  return ARTICLES.filter(a=>{
    if(curSrc!=='ALL' && a.source!==curSrc) return false;
    if(curCat!=='all' && a.category!==curCat) return false;
    if(curQ){const q=curQ.toLowerCase();const hay=(a.title+' '+(a.titleCn||'')+' '+a.source+' '+((a.tags||[]).join(' '))).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
function metaLine(a){return `${a.source} · ${a.level} · ${a.readingMin||a.min||'—'} 分钟 · ${a.date}`;}
function renderHome(){
  const list=filtered();
  const hero=document.getElementById('hero'),grid=document.getElementById('grid'),empty=document.getElementById('empty');
  if(list.length===0){hero.classList.add('hidden');grid.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');hero.classList.remove('hidden');
  const feat=list[0],rest=list.slice(1);
  const sideItems=rest.slice(0,3);
  hero.innerHTML=`
    <div class="lead">
      <div class="kicker">${feat.source} · ${catName(feat.category)}</div>
      <h2>${esc(feat.title)}</h2>
      <div class="dek">${esc(feat.excerptCn||feat.excerpt)}</div>
      <div class="meta"><span>${metaLine(feat)}</span>${feat.byline?`<span>By ${esc(feat.byline)}</span>`:''}</div>
    </div>
    <div class="side">${sideItems.map(s=>`<div class="mini" data-id="${s.id}"><div class="k">${s.source}</div><div class="t">${esc(s.titleCn||s.title)}</div></div>`).join('')}</div>`;
  if(rest.length===0){
    grid.innerHTML=`<div class="hint">当前分类「<b>${esc(catName(curCat))}</b>」只有 1 篇。点 <button class="linklike" onclick="curCat='all';renderCats();renderHome();">「全部」</button> 查看全部文章。</div>`;
  } else {
    grid.innerHTML=rest.slice(3).map(a=>cardHTML(a)).join('');
    if(rest.length<=3) grid.innerHTML=rest.map(a=>cardHTML(a)).join('');
  }
  hero.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openArticle(b.dataset.id));
  // hero 整体可点（除 .side 区域）
  hero.onclick=(e)=>{ if(e.target.closest('.side')) return; openArticle(feat.id); };
  grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openArticle(b.dataset.id));
}
function cardHTML(a){
  return `<div class="card" data-id="${a.id}">
    <div class="kicker"><span>${a.source} · ${catName(a.category)}</span><span class="lv">${a.level.split(' ')[0]}</span></div>
    <h3>${esc(a.title)}</h3>
    <div class="dek">${esc(a.excerptCn||a.excerpt)}</div>
    <div class="meta"><span>${a.readingMin||a.min||'—'} 分钟</span><span>${a.date}</span>${a.byline?`<span>${esc(a.byline)}</span>`:''}</div>
  </div>`;
}

/* ============ 阅读器 ============ */
const COLLOC=[];
function highlightCollocations(text,cols){
  if(!cols||!cols.length) return esc(text);
  let t=esc(text);
  const ec=cols.map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('('+ec.join('|')+')','gi');
  return t.replace(re,'<span class="collocation" title="固定搭配">$1</span>');
}
function renderBody(a){
  let html='';const cols=a.collocations||[];
  a.body.forEach((en,i)=>{
    const cn=(a.bodyCn&&a.bodyCn[i])?a.bodyCn[i]:'';
    html+=`<p class="para en" data-i="${i}">${highlightCollocations(en,cols)}<span class="ptool"><button class="tbtn" data-i="${i}">译</button><button class="gbtn" data-i="${i}">析</button><button class="hbtn" data-i="${i}" title="整段划线到笔记">✏️</button></span></p>`;
    if(cn&&cn.trim()) html+=`<p class="para cn" data-ci="${i}">${highlightCollocations(cn,cols)}</p>`;
  });
  (a.quotes||[]).forEach(q=>{
    const txt=typeof q==='string'?q:(q.text||'');const who=typeof q==='string'?'':(q.who||'');
    if(txt) html+=`<div class="pull">"${esc(txt)}"${who?`<br><small style="font-style:normal;color:var(--muted)">— ${esc(who)}</small>`:''}</div>`;
  });
  return html;
}
/* ---------- EPUB 上传 + 本地书架（Glose 式） ---------- */
let _db=null, EPUB_CTX=null;
function idb(){ return new Promise((res,rej)=>{ if(_db)return res(_db); if(!('indexedDB' in window))return rej(new Error('no idb')); const r=indexedDB.open('lumina-books',1); r.onupgradeneeded=e=>{const d=e.target.result; if(!d.objectStoreNames.contains('books')) d.createObjectStore('books',{keyPath:'bookId'});}; r.onsuccess=e=>{_db=e.target.result;res(_db);}; r.onerror=()=>rej(r.error); }); }
function idbPut(v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('books','readwrite'); tx.objectStore('books').put(v); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })); }
function idbGetAll(){ return idb().then(db=>new Promise((res,rej)=>{ const rq=db.transaction('books','readonly').objectStore('books').getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); })); }
function idbDel(id){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction('books','readwrite'); tx.objectStore('books').delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h).toString(36); }
function epubText(el){ return (el.textContent||'').replace(/\s+/g,' ').trim(); }
async function parseEpub(file){
  const buf = await file.arrayBuffer();
  const zip = window.fflate.unzipSync(new Uint8Array(buf));
  const get = (p)=> zip[p] ? window.fflate.strFromU8(zip[p]) : '';
  const container = get('META-INF/container.xml');
  const cdoc = new DOMParser().parseFromString(container,'application/xml');
  const rootfile = cdoc.querySelector('rootfile');
  if(!rootfile) throw new Error('无效的 EPUB（缺少 rootfile）');
  const opfPath = rootfile.getAttribute('full-path') || '';
  const opf = new DOMParser().parseFromString(get(opfPath),'application/xml');
  const baseDir = opfPath.includes('/') ? opfPath.slice(0,opfPath.lastIndexOf('/')+1) : '';
  const title = opf.querySelector('metadata title') ? epubText(opf.querySelector('metadata title')) : file.name.replace(/\.epub$/i,'');
  const author = opf.querySelector('metadata creator') ? epubText(opf.querySelector('metadata creator')) : '未知作者';
  const manifest = {};
  opf.querySelectorAll('manifest item').forEach(it=>{ const id=it.getAttribute('id'); const href=it.getAttribute('href'); if(id&&href) manifest[id]=href; });
  const chapters = [];
  opf.querySelectorAll('spine itemref').forEach(it=>{
    const href = manifest[it.getAttribute('idref')];
    if(!href) return;
    const xhtml = get(baseDir+href);
    if(!xhtml) return;
    const d = new DOMParser().parseFromString(xhtml,'text/html');
    const h = d.querySelector('h1,h2,h3,h4');
    const chTitle = h ? epubText(h) : ('第'+(chapters.length+1)+'章');
    const paras = [...d.querySelectorAll('p')].map(p=>epubText(p)).filter(t=>t.length>20);
    if(paras.length) chapters.push({ title: chTitle, body: paras });
  });
  if(!chapters.length) throw new Error('未能从 EPUB 提取到章节文本');
  return { bookId:'epub-'+hashStr(file.name+'|'+file.size), title, titleCn:'', author, chapters };
}
function detectLang(text){
  const cn=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  const en=(text.match(/[a-zA-Z]/g)||[]).length;
  return cn>en ? 'zh' : 'en';
}
async function uploadEpub(file){
  const meta = await parseEpub(file);
  const sample = meta.chapters.slice(0,2).map(c=>c.body.join(' ')).join(' ');
  const lang = detectLang(sample);
  await idbPut({ bookId:meta.bookId, title:meta.title, titleCn:'', author:meta.author, cover:'', lang, chapters:meta.chapters, added:Date.now() });
  return meta;
}

// 优先挑选系统里最自然的人声（Neural/Google/Siri 等），避免机械音
function pickVoice(){
  try{
    if(!_voices.length && 'speechSynthesis' in window) _voices=speechSynthesis.getVoices();
    const en=_voices.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('en')===0);
    if(!en.length) return null;
    const prio=[
      v=>/natural/i.test(v.name),
      v=>/neural/i.test(v.name),
      v=>/google/i.test(v.name),
      v=>/samantha|aria|karen|jenny|ava|allison|susan|serena/i.test(v.name),
      v=>/microsoft|online/i.test(v.name),
      v=>/female|zira|hazel/i.test(v.name)
    ];
    for(const p of prio){ const hit=en.find(p); if(hit) return hit; }
    return en.find(v=>v.lang==='en-US') || en[0];
  }catch(e){ return null; }
}

async function openEpubBook(bookId, chIdx){

  let body, bodyCn;

  else { body = ch.body; bodyCn = hasTrans ? ch.translated : []; }

    readingMin: Math.max(3, Math.round(ch.body.join(' ').split(/\s+/).length/180)),
    tags:['EPUB'], collocations:[], quotes:[], body, bodyCn, date:''
  };

  CUR_TRANS = hasTrans ? null : { bookId, chIdx, lang, from: lang==='en'?'en':'zh-CN', to: lang==='en'?'zh-CN':'en' };
  renderReader();

let CUR_TRANS=null;
async function mymemoryTranslate(text, from, to){
  const q=text.slice(0,480);
  try{
    const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=${from}|${to}`);
    const j=await r.json();
    if(j.responseStatus===200 && j.responseData && j.responseData.translatedText){
      let t=j.responseData.translatedText;
      if(q.length < text.length) t += ' …';
      return t;
    }
  }catch(e){}
  return '';
}
async function translateCurrentChapter(){

  if(btn) btn.disabled=true;

  const paras=ch.body;

  for(let i=0;i<paras.length;i++){
    if(prog) prog.textContent=`翻译中 ${i+1}/${paras.length}…`;
    const t=await mymemoryTranslate(paras[i], from, to);
    translated.push(t);
    if(i%3===2 || i===paras.length-1){ ch.translated=translated.concat(new Array(paras.length-i-1).fill('')); await idbPut(up); }
  }
  ch.translated=translated;
  await idbPut(up);

  openEpubBook(bookId, chIdx);
}

function buildShareCard(n){
  return new Promise((resolve,reject)=>{
    try{
      const W=760, L=60, R=60, T=64;
      const title=n.bookTitle||'锋刊双语阅读';

        const lines=[]; let line='';

          // 中文按字符换行

            if(m.measureText(t).width>maxW && line){ lines.push(line); line=w; }
            else line=t;
          }
          if(line) lines.push(line);
        }
        return lines;
      }
      const quoteLines=wrap(quote,'bold 42px Georgia, "Times New Roman", serif', W-L-R-28);
      const cnLines=quoteCn?wrap(quoteCn,'22px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif', W-L-R):[];
      const ideaLines=idea?wrap(idea,'italic 24px Georgia, serif', W-L-R):[];
      const H=T+46+34+quoteLines.length*58+(cnLines.length?cnLines.length*32+20:0)+50+(ideaLines.length?ideaLines.length*36+44:0)+110;
      const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
      const c=cv.getContext('2d');
      // 背景（米色纸感）
      c.fillStyle='#faf6ee'; c.fillRect(0,0,W,H);
      // 顶部金线
      c.fillStyle='#b08d57'; c.fillRect(L,44,46,3);
      // 书名+章节
      c.fillStyle='#8a7a5c'; c.font='18px Georgia, serif';
      c.fillText(title+' · '+chapter, L, 82);
      // 左装饰竖条
      const qTop=104;
      c.fillStyle='#b08d57'; c.fillRect(L,qTop,4,quoteLines.length*58);
      // 划线正文（英文）
      c.fillStyle='#2b2620'; c.font='bold 42px Georgia, "Times New Roman", serif';
      quoteLines.forEach((ln,i)=>{ c.fillText(ln, L+24, qTop+42+i*58); });
      let y=qTop+quoteLines.length*58+26;
      // 中文对照
      if(cnLines.length){
        c.fillStyle='#8a7a5c'; c.font='22px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
        cnLines.forEach((ln,i)=>{ c.fillText(ln, L+24, y+i*32); });
        y+=cnLines.length*32+20;
      }
      // 想法
      y+=18;
      if(ideaLines.length){
        c.fillStyle='#a08a64'; c.font='italic 24px Georgia, serif';
        ideaLines.forEach((ln,i)=>{ c.fillText('— '+ln, L, y+i*36); });
        y+=ideaLines.length*36+30;
      }
      // 底部品牌
      c.fillStyle='#b08d57'; c.font='16px Georgia, serif';
      c.fillText('锋刊 · 双语阅读', L, H-44);
      resolve(cv.toDataURL('image/png'));
    }catch(e){ reject(e); }
  });
}

function walkWrap(node){
  [...node.childNodes].forEach(child=>{
    if(child.nodeType===3){
      const frag=document.createDocumentFragment();
      child.textContent.split(/(\b[A-Za-z][A-Za-z'-]*\b)/).forEach(tok=>{
        if(/^[A-Za-z][A-Za-z'-]*$/.test(tok)){const s=document.createElement('span');s.className='w';s.dataset.w=tok;frag.appendChild(s);s.textContent=tok;}
        else frag.appendChild(document.createTextNode(tok));
      });
      node.replaceChild(frag,child);
    }else if(child.classList&&child.classList.contains('collocation')){}
    else if(child.nodeType===1){walkWrap(child);}
  });

/* ============ 长难句语法分析（规则驱动，离线） ============ */
const CONN=[
  {re:/\b(because|since|as|for)\b/gi,f:'原因状语从句'},
  {re:/\b(although|though|even though|whereas|while)\b/gi,f:'让步状语从句'},
  {re:/\b(if|unless|provided|suppose|in case)\b/gi,f:'条件状语从句'},
  {re:/\b(when|before|after|until|once|as soon as)\b/gi,f:'时间状语从句'},
  {re:/\b(where)\b/gi,f:'地点状语从句'},
  {re:/\b(so that|in order that|lest)\b/gi,f:'目的状语从句'},
  {re:/\b(so that|such \.\.\. that|so \.\.\. that)\b/gi,f:'结果状语从句'},
  {re:/\b(that|which|who|whom|whose|why|how)\b/gi,f:'定语从句(关系词)'},
  {re:/\b(and|but|or|yet|for|so)\b/gi,f:'并列连词'},
  {re:/\b(however|therefore|thus|meanwhile|nevertheless|moreover|furthermore|instead)\b/gi,f:'衔接副词(状语)'}
];
function splitSentences(text){return text.match(/[^.!?]+[.!?]+/g)|| [text];}
function analyzeSentence(s){
  const words=s.trim().match(/[A-Za-z']+/g)||[];
  const wl=words.length;
  if(wl<22) return {short:true,wl};
  const found=[];
  CONN.forEach(c=>{let m;c.re.lastIndex=0;while((m=c.re.exec(s))){found.push({i:m.index,len:m[0].length,f:c.f,txt:m[0]});}});
  found.sort((a,b)=>a.i-b.i);
  const nodes=[];
  let main=s.slice(0,found.length?found[0].i:wl).trim();
  if(main) nodes.push({main:true,text:main});
  found.forEach((c,idx)=>{
    const end=found[idx+1]?found[idx+1].i:s.length;
    let clause=s.slice(c.i,end).trim();
    nodes.push({main:false,f:c.f,text:clause});
  });
  const summary=`本句共 ${wl} 词，含 ${found.length} 个连接成分，为${found.length? '复合':'简单'}句。主干（主句）在前，后续为从句/并列结构；建议先抓主句主干，再逐层理解连接成分的功能。`;
  return {short:false,wl,nodes,summary,found:found.length};
}
function openGrammar(i){
  const en=CUR.body[parseInt(i,10)]||'';

  const sents=splitSentences(en);

    if(r.short){html+=`<div class="gsum">短句（${r.wl} 词）：${esc(s.trim())}</div>`;return;}
    html+=`<div class="gsum">${esc(r.summary)}</div>`;
    r.nodes.forEach(n=>{
      if(n.main) html+=`<div class="gnode main"><span class="tagf">主句</span>${esc(n.text)}</div>`;
      else html+=`<div class="gnode"><span class="tagf">${esc(n.f)}</span>${esc(n.text)}</div>`;
    });
  });
  document.getElementById('panelBody').innerHTML=html;
}

/* ============ 学习中心 · 流利说式闭环 ============ */
const QUEST={read:1,lookup:5,shadow:3,dictation:2,review:10};
const XP={read:5,lookup:1,shadow:3,dictation:2,review:1};
function getLL(){try{return JSON.parse(getLS(LS.ll)||'{}');}catch(e){return{};}}
function saveLL(s){setLS(LS.ll,JSON.stringify(s));}
function todayTasks(){const s=getLL();const k=dayKey(new Date());if(s.day!==k){s.day=k;s.tasks={read:0,lookup:0,shadow:0,dictation:0,review:0};s.questDone=false;saveLL(s);}return s.tasks||(s.tasks={read:0,lookup:0,shadow:0,dictation:0,review:0});}
function llTask(type,n){n=n||1;const s=getLL();const t=todayTasks();t[type]=(t[type]||0)+n;s.xp=(s.xp||0)+(XP[type]||0)*n;s.tot=s.tot||{};s.tot[type]=(s.tot[type]||0)+n;
  const done=Object.keys(QUEST).every(k=>(t[k]||0)>=QUEST[k]);
  if(done&&!s.questDone){s.questDone=true;s.questDays=(s.questDays||0)+1;s.xp+=20;}
  saveLL(s);if(!document.getElementById('learnView').classList.contains('hidden'))renderLearn();}
function llLevel(s){const xp=s.xp||0;const lv=Math.floor(Math.sqrt(xp/40))+1;const base=(lv-1)*(lv-1)*40;const next=lv*lv*40;return {lv,xp,base,next,pct:Math.min(100,Math.round((xp-base)/(next-base)*100))};}
function getSent(){try{return JSON.parse(getLS(LS.sent)||'[]');}catch(e){return[];}}
function addSent(en,cn,src){const v=getSent();if(v.find(x=>x.en===en))return;v.unshift({en,cn:cn||'',src:src||'',box:1,due:Date.now()+86400000,reps:0,added:dayKey(new Date())});setLS(LS.sent,JSON.stringify(v));}
function sentPool(){const pool=DAILY_SENTENCES.map(d=>({en:d.en,cn:d.cn,src:d.src}));
  ARTICLES.forEach(a=>(a.quotes||[]).forEach(q=>{const en=typeof q==='string'?q:(q.text||'');if(en)pool.push({en,cn:'',src:a.source});}));
  getSent().forEach(s=>pool.push({en:s.en,cn:s.cn,src:s.src}));return pool;}
function hasRec(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function speakSlow(w){try{const u=new SpeechSynthesisUtterance(w);const v=pickVoice();if(v)u.voice=v;u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function scorePron(transcript,original){const norm=s=>s.toLowerCase().replace(/[^a-z'\s]/g,' ').split(/\s+/).filter(Boolean);
  const o=norm(original),t=norm(transcript||'');if(!t.length||!o.length)return{acc:0,hit:0,total:o.length};
  const bag={};o.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;t.forEach(w=>{if(bag[w]>0){bag[w]--;hit++;}});
  return{acc:Math.round(hit/o.length*100),hit,total:o.length};}
function rateItem(arr,item,r,key){if(r==='know'){item.box=Math.min(5,item.box+1);item.due=Date.now()+boxInterval(item.box);}else if(r==='vague'){item.due=Date.now()+86400000;}else{item.box=1;item.due=Date.now()+86400000;}item.reps=(item.reps||0)+1;setLS(key,JSON.stringify(arr));}

function renderShadow(){
  const pool=sentPool();const body=document.getElementById('llBody');
  if(!pool.length){body.innerHTML=`<div class="hint">暂无可跟读句子，去首页学每日金句或收藏文章金句后即可练习。</div>`;return;}
  let cur=pool[Math.floor(Math.random()*pool.length)];
  function draw(){
    body.innerHTML=`<div class="studio">
      <div class="st-hint">跟读配音 · 流利说式发音练习</div>
      <div class="st-en">${esc(cur.en)}</div>
      <div class="st-cn">${esc(cur.cn)||'<span style="color:var(--muted)">（无中文译注）</span>'}</div>
      <div class="st-ctrls">
        <button class="sb" id="sListen">🔊 听原音</button>
        <button class="sb primary" id="sRec">🎙 开始跟读</button>
        <button class="sb" id="sNext">换一句</button>
      </div>
      <div id="sPlay" class="st-play"></div>
      <div id="sResult" class="st-result"></div>
      <div class="hint">${hasRec()?'浏览器支持语音识别，将自动转录并评测发音匹配度（词级命中率）。':'当前浏览器不支持语音识别，可用录音回放自测；发音匹配度将标记为未识别。'}</div>
    </div>`;
    document.getElementById('sListen').onclick=()=>speakSlow(cur.en);
    document.getElementById('sNext').onclick=()=>{cur=pool[Math.floor(Math.random()*pool.length)];draw();};
    document.getElementById('sRec').onclick=startRec;
  }
  function startRec(){
    const recBtn=document.getElementById('sRec');const result=document.getElementById('sResult');
    result.innerHTML='';speakSlow(cur.en);
    let mr=null,audioUrl=null;
    const begin=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(stream);const ch=[];mr.ondataavailable=e=>ch.push(e.data);mr.onstop=()=>{const blob=new Blob(ch,{type:'audio/webm'});audioUrl=URL.createObjectURL(blob);document.getElementById('sPlay').innerHTML=`<audio controls src="${audioUrl}"></audio>`;};mr.start();}catch(e){}};
    let rec=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let txt='';
    if(SR){rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.continuous=false;rec.onresult=ev=>{txt='';for(let i=0;i<ev.results.length;i++)txt+=ev.results[i][0].transcript;};rec.onend=()=>finish(txt);rec.onerror=()=>finish(txt);rec.start();}
    begin();
    recBtn.textContent='⏹ 停止并评测';recBtn.onclick=()=>{try{mr&&mr.stop();}catch(e){}try{rec&&rec.stop();}catch(e){}recBtn.textContent='🎙 开始跟读';recBtn.onclick=startRec;};
    function finish(transcript){try{mr&&mr.stop();}catch(e){}
      const sc=scorePron(transcript,cur.en);llTask('shadow');
      result.innerHTML=`<div class="st-score">发音匹配度 <b>${sc.acc}%</b> <small>识别到 ${sc.hit}/${sc.total} 词</small></div>
        <div class="st-you">你说：${esc(transcript||'（未识别到语音）')}</div>
        <div class="st-rate"><button class="know" data-r="know">读得准</button><button class="vague" data-r="vague">还行</button><button class="unk" data-r="unk">再来</button></div>`;
      result.querySelectorAll('.st-rate button').forEach(b=>b.onclick=()=>{addSent(cur.en,cur.cn,cur.src);const v=getSent();const it=v.find(x=>x.en===cur.en);if(it)rateItem(v,it,b.dataset.r,LS.sent);draw();});
    }
  }
  draw();
}
function renderDictation(){
  const pool=sentPool().filter(s=>(s.en.match(/[A-Za-z']+/g)||[]).length>=6);
  const body=document.getElementById('llBody');
  if(!pool.length){body.innerHTML=`<div class="hint">暂无可听写句子，去跟读或收藏金句后可练习。</div>`;return;}
  let cur=pool[Math.floor(Math.random()*pool.length)];
  function draw(){
    const words=cur.en.match(/[A-Za-z']+/g)||[];
    const STOP=new Set(['the','a','an','of','to','in','on','and','or','is','are','was','were','for','with','that','this','it','as','at','by','from','be','been','being','but','not','we','you','they','he','she','his','her','their','our','i','my','your','its','than','then','so','if','about','into','over','after','before','do','did','does','will','would','can','could','should','has','have','had']);
    const idx=[];words.forEach((w,i)=>{if(w.length>3&&!STOP.has(w.toLowerCase())&&i>0&&i<words.length-1)idx.push(i);});
    const pickN=Math.max(2,Math.min(3,Math.floor(idx.length/3)));
    const blanks=idx.sort(()=>Math.random()-.5).slice(0,pickN);
    let wi=0;const html=cur.en.split(/(\s+)/).map(tok=>{
      if(/^[A-Za-z']+$/.test(tok)){const isB=blanks.includes(wi);const w=tok;wi++;return isB?`<input class="dt-in" data-ans="${esc(w.toLowerCase())}" size="${Math.max(3,w.length)}">`:`<span>${esc(w)}</span>`;}
      return esc(tok);
    }).join('');
    body.innerHTML=`<div class="studio">
      <div class="st-hint">听写填空 · 听原音补全空缺单词</div>
      <button class="sb" id="dListen">🔊 听原音</button>
      <div class="dt-sent">${html}</div>
      <div class="st-cn">${esc(cur.cn)||''}</div>
      <div class="st-ctrls"><button class="sb primary" id="dCheck">提交批改</button><button class="sb" id="dNext">换一句</button></div>
      <div id="dResult"></div>
    </div>`;
    document.getElementById('dListen').onclick=()=>speak(cur.en);
    document.getElementById('dNext').onclick=()=>{cur=pool[Math.floor(Math.random()*pool.length)];draw();};
    document.getElementById('dCheck').onclick=()=>{
      const ins=body.querySelectorAll('.dt-in');let ok=0,tot=0;
      ins.forEach(inp=>{tot++;const ans=inp.dataset.ans;const val=inp.value.trim().toLowerCase().replace(/[^a-z']/g,'');if(val===ans){ok++;inp.classList.add('ok');}else{inp.classList.add('bad');inp.value=ans;}});
      llTask('dictation');
      document.getElementById('dResult').innerHTML=`<div class="st-score">正确率 <b>${tot?Math.round(ok/tot*100):0}%</b> <small>${ok}/${tot}</small></div>`;
    };
  }
  draw();
}

function sentenceReview(all){
  const due=all.filter(x=>x.due<=Date.now());const queue=due.length?due:all.slice(0,8);
  const box=document.getElementById('llBody');let i=0,done=0;
  function show(){
    if(i>=queue.length){box.innerHTML=`<div class="session"><div class="q">完成！</div><div class="pc">本轮复习 ${done} 句。</div><button class="startbtn" id="bk">返回</button></div>`;document.getElementById('bk').onclick=()=>{llTab='sent';renderLearn();};return;}
    const s=queue[i];
    box.innerHTML=`<div class="session"><div class="pc">进度 ${i+1}/${queue.length}</div>
      <div class="q">${esc(s.en)}</div>
      <button class="startbtn" id="reveal" style="margin:8px">显示中文</button>
      <div id="ans" class="hidden"><div class="pc">${esc(s.cn||'（无译注）')}</div></div>
      <div class="rate hidden" id="rate"><button class="know" data-r="know">认识</button><button class="vague" data-r="vague">模糊</button><button class="unk" data-r="unk">不认识</button></div></div>`;
    document.getElementById('reveal').onclick=()=>{document.getElementById('ans').classList.remove('hidden');document.getElementById('rate').classList.remove('hidden');speak(s.en);};
    document.getElementById('rate').querySelectorAll('button').forEach(b=>b.onclick=()=>{rateItem(all,s,b.dataset.r,LS.sent);i++;done++;show();});
  }
  show();
}

function startSession(){
  const v=getVocab().filter(x=>!x.quote&&x.due<=Date.now());
  const goal=parseInt(getLS(LS.goal)||'20',10);
  const queue=v.slice(0,goal);
  const box=document.getElementById('llBody');if(!box)return;
  if(!queue.length){box.innerHTML=`<div class="session"><div class="pc">今日已无待复习词，去阅读收藏新词吧 🎉</div><button class="startbtn" id="bk">返回</button></div>`;const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{llTab='today';renderLearn();};return;}
  let i=0,done=0;
  function show(){
    if(i>=queue.length){box.innerHTML=`<div class="session"><div class="q">完成！</div><div class="pc">本轮复习 ${done} 词。</div><button class="startbtn" id="bk">返回学习中心</button></div>`;document.getElementById('bk').onclick=()=>{llTab='today';renderLearn();};return;}
    const w=queue[i];
    box.innerHTML=`<div class="session">
      <div class="pc">进度 ${i+1}/${queue.length}</div>
      <div class="q">${esc(w.word)}</div>
      <div class="pa">${esc(w.p||'')}</div>
      <button class="startbtn" id="reveal" style="margin:8px">显示释义</button>
      <div id="ans" class="hidden"><div class="pc">${esc(w.cn||'')}</div></div>
      <div class="rate hidden" id="rate">
        <button class="know" data-r="know">认识</button>
        <button class="vague" data-r="vague">模糊</button>
        <button class="unk" data-r="unk">不认识</button>
      </div>
    </div>`;
    document.getElementById('reveal').onclick=()=>{document.getElementById('ans').classList.remove('hidden');document.getElementById('rate').classList.remove('hidden');speak(w.word);};
    document.getElementById('rate').querySelectorAll('button').forEach(b=>b.onclick=()=>{rate(w,b.dataset.r);i++;done++;show();});
  }
  show();
}
function rate(w,r){
  const v=getVocab();const t=v.find(x=>x.word===w.word&&!x.quote);if(!t)return;
  if(r==='know'){t.box=Math.min(5,t.box+1);t.due=Date.now()+boxInterval(t.box);}
  else if(r==='vague'){t.due=Date.now()+86400000;}
  else {t.box=1;t.due=Date.now()+86400000;}
  t.reps=(t.reps||0)+1;setLS(LS.vocab,JSON.stringify(v));llTask('review');
}

/* ============ streak ============ */
function streakCount(){let s;try{s=JSON.parse(getLS(LS.streak)||'{}');}catch(e){s={};}return s.count||0;}
function updateStreak(){let s;try{s=JSON.parse(getLS(LS.streak)||'{}');}catch(e){s={};}const today=dayKey(new Date());if(s.last!==today){const y=new Date(Date.now()-86400000).toISOString().slice(0,10);s.count=(s.last===y)?(s.count+1):1;s.last=today;setLS(LS.streak,JSON.stringify(s));}}

    <div class="setrow"><label>数据管理</label>
      <div class="seg2"><button id="exportVocab">导出单词本(JSON)</button><button id="clearVocab">清空单词本</button><button id="resetStats">重置统计</button></div></div>
    <div class="hint">词典：内置 GitHub ECDICT 离线核心词库（点击查词带音标+释义，离线可用），生僻词运行时自动联网 dictionaryapi.dev 补全。翻译：段落/全文双语对照，自动采集时由百度翻译回填中文。</div>`;
  document.getElementById('saveUrl').onclick=()=>{setLS(LS.data,document.getElementById('dataUrl').value.trim());location.reload();};
  document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{setLS(LS.theme,b.dataset.t);applyTheme();});
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',getLS(LS.theme)===b.dataset.t));
  document.getElementById('fMinus').onclick=()=>{let f=Math.max(15,parseInt(getLS(LS.font)||'18',10)-2);setLS(LS.font,f);applyFont();renderSettings();};
  document.getElementById('fPlus').onclick=()=>{let f=Math.min(30,parseInt(getLS(LS.font)||'18',10)+2);setLS(LS.font,f);applyFont();renderSettings();};
  document.querySelectorAll('#goalSeg button').forEach(b=>b.onclick=()=>{setLS(LS.goal,b.dataset.g);renderSettings();renderLearn();});
  document.getElementById('exportVocab').onclick=exportVocab;
  document.getElementById('clearVocab').onclick=()=>{if(confirm('确定清空单词本？')){localStorage.removeItem(LS.vocab);renderVocab();}};
  document.getElementById('resetStats').onclick=()=>{if(confirm('重置阅读统计？')){localStorage.removeItem(LS.read);localStorage.removeItem(LS.streak);}};
}
function applyTheme(){const t=getLS(LS.theme)||'light';document.documentElement.setAttribute('data-theme',t);}
function exportVocab(){const v=getVocab();const blob=new Blob([JSON.stringify(v,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vocab.json';a.click();}
function flash(msg){const d=document.createElement('div');d.textContent=msg;d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:99;font-size:14px';document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}

/* ============ 视图切换 ============ */
function showView(v){
  document.getElementById('homeView').classList.toggle('hidden',v!=='home');
  document.getElementById('booksView').classList.toggle('hidden',v!=='books');
  document.getElementById('learnView').classList.toggle('hidden',v!=='learn');
  document.getElementById('notesView').classList.toggle('hidden',v!=='notes');
  document.getElementById('vocabView').classList.toggle('hidden',v!=='vocab');
  document.getElementById('settingsView').classList.toggle('hidden',v!=='settings');
  document.querySelectorAll('.nav button[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='books')renderBooks();
  if(v==='notes')renderNotes();
  if(v==='learn')renderLearn();if(v==='vocab')renderVocab();if(v==='settings')renderSettings();
  if(v!=='home')document.getElementById('reader').classList.remove('open');
}

/* ============ 进度条 ============ */
document.getElementById('reader').addEventListener('scroll',e=>{
  const el=e.target;const h=el.scrollHeight-el.clientHeight;const p=h>0?(el.scrollTop/h*100):0;
  document.getElementById('progress').style.width=p+'%';
});

/* ============ 初始化 ============ */
async function init(){
  document.getElementById('todayDate').textContent=fmtDate();
  applyTheme();
  loadVoices();
  await Promise.all([loadData(),loadDict(),loadBooksData()]);
  migrateVocabQuotes();
  renderRail();renderCats();renderDaily();renderHome();
  document.getElementById('search').oninput=e=>{curQ=e.target.value;renderHome();};
  document.querySelectorAll('.nav button[data-view]').forEach(b=>b.onclick=()=>showView(b.dataset.view));
  document.getElementById('readerBack').onclick=()=>{document.getElementById('reader').classList.remove('open');document.getElementById('panel').classList.remove('open');};
  document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);});
  document.getElementById('fontMinus').onclick=()=>{let f=Math.max(15,parseInt(getLS(LS.font)||'18',10)-2);setLS(LS.font,f);applyFont();};
  document.getElementById('fontPlus').onclick=()=>{let f=Math.min(30,parseInt(getLS(LS.font)||'18',10)+2);setLS(LS.font,f);applyFont();};
  document.getElementById('panelBtn').onclick=()=>openPanel(panelTab);
  document.getElementById('panelClose').onclick=()=>document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.panel .ph button').forEach(b=>b.onclick=()=>openPanelTab(b.dataset.tab));
  document.addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('.w')&&!e.target.closest('.collocation'))document.getElementById('pop').style.display='none';});
  // PWA install
  let def=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();def=e;document.getElementById('installBtn').style.display='';document.getElementById('installBtn').onclick=()=>def.prompt();});
  document.getElementById('installBtn').style.display='none';
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;if(!nw)return;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            flash('已更新到最新版，即将刷新…');
            setTimeout(()=>location.reload(),700);
          }
        });
      });
    }).catch(()=>{});
  }
}
init();
</script>
